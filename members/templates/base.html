{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Personal website and portfolio">
  <link rel="icon" type="image/png" sizes="16x16" href="{% static 'images/favicon.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">

  <title>{% block title %}My Space{% endblock %}</title>
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main-content">Skip to content</a>

  <nav class="site-nav" aria-label="Main navigation">
    <a class="brand" href="{% url 'home' %}">ESIN / SPACE</a>
    <div class="nav-links">
      <a href="{% url 'about' %}">About</a>
      <a href="{% url 'contact' %}">Contact</a>
      <a href="https://github.com/Oliebol23" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
    </div>
  </nav>

  <main id="main-content">
    {% block content %}{% endblock %}
  </main>

  {% block extra_js %}{% endblock %}
</body>
</html>
